<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avis Mockup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: #f5f5f5;
    }

    .newspaper {
      max-width: 800px;
      margin: 0 auto;
      background: white;
    }

    /* Header */
    .top-header {
      background-color: #003d7a;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .nav-menu {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-menu a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-menu a:hover {
      opacity: 0.8;
    }

    .hamburger {
      font-size: 24px;
      cursor: pointer;
      color: white;
    }

    /* Hero Article */
    .hero-article {
      padding: 30px 20px;
      border-bottom: 2px solid #ddd;
      margin-bottom: 20px;
    }

    .hero-image {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 20px;
      display: block;
    }

    .hero-article h2 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .hero-article p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
    }

    /* Advertisement Container */
    .ad-section {
      padding: 20px;
      border: 2px solid #ddd;
      border-radius: 4px;
      margin: 20px;
      background-color: #f9f9f9;
    }

    .ad-container {
      border-radius: 4px;
      padding: 20px;
      background-color: #f9f9f9;
      min-height: auto;
    }

    .ad-container.theme-blue {
      border-color: #0066cc;
      border: 2px solid #0066cc;
    }

    .ad-container.theme-red {
      border-color: #cc0000;
      border: 2px solid #cc0000;
    }

    .ad-container.theme-green {
      border-color: #00aa00;
      border: 2px solid #00aa00;
    }

    .ad-container.theme-dark {
      border-color: #333;
      border: 2px solid #333;
      background-color: #333;
      color: white;
    }

    .ad-heading {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      min-height: 30px;
    }

    .ad-container.theme-dark .ad-heading {
      color: white;
    }

    .ad-body {
      font-size: 14px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 15px;
      min-height: 40px;
    }

    .ad-container.theme-dark .ad-body {
      color: #ddd;
    }

    .ad-image {
      width: 100%;
      min-height: 120px;
      max-height: 300px;
      background-color: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 12px;
      overflow: hidden;
    }

    .ad-container.theme-dark .ad-image {
      background-color: #555;
    }

    .ad-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .ad-cta {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
      min-width: 120px;
      text-align: center;
    }

    .ad-cta:hover {
      opacity: 0.9;
    }

    .ad-container.theme-blue .ad-cta {
      background-color: #0066cc;
      color: white;
    }

    .ad-container.theme-red .ad-cta {
      background-color: #cc0000;
      color: white;
    }

    .ad-container.theme-green .ad-cta {
      background-color: #00aa00;
      color: white;
    }

    .ad-container.theme-dark .ad-cta {
      background-color: white;
      color: #333;
    }

    .status {
      margin-top: 20px;
      padding: 10px;
      background-color: #e3f2fd;
      border-left: 4px solid #2196F3;
      border-radius: 2px;
      font-size: 12px;
      color: #1565c0;
    }

    .ad-container.theme-dark .status {
      background-color: #444;
      border-left-color: #666;
      color: #aaa;
    }

    /* Media Left Article */
    .article-media-left {
      display: flex;
      gap: 20px;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      align-items: flex-start;
    }

    .article-image {
      width: 150px;
      height: 100px;
      background-color: #e0e0e0;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 12px;
      background-size: cover;
      background-position: center;
    }

    .article-content h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .article-content p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="newspaper">
    <!-- Header -->
    <div class="top-header">
      <!-- 𝔗𝔯𝔬𝔫𝔡𝔥𝔧𝔢𝔪𝔰𝔣𝔧𝔬𝔯𝔡𝔢𝔫𝔰 𝔅𝔲𝔡𝔰𝔱𝔦𝔨𝔨𝔢  -->
      <div class="logo">𝔗𝔯𝔬𝔫𝔡𝔥𝔢𝔦𝔪𝔰 𝔗𝔢𝔩𝔢𝔤𝔯𝔞𝔭𝔥</div>
      <div class="nav-menu">
        <a href="#">Nyheter</a>
        <a href="#">Sport</a>
        <a href="#">Traveldag</a>
        <div class="hamburger">☰</div>
      </div>
    </div>

    <!-- Articles Container -->
    <div id="articlesContainer"></div>

    <!-- Advertisement Section -->
    <div class="ad-section" id="adSection">
      <div class="ad-container theme-blue" id="adContainer">
        <div class="ad-heading" id="adHeading">Overskrift kommer her</div>
        <div class="ad-body" id="adBody"></div>
        <div class="ad-image" id="adImage">Bilde kommer her</div>
        <button class="ad-cta" id="adCta"></button>
        <div class="status" id="status">Venter på data...</div>
      </div>
    </div>
  </div>

  <script>
    // Article data structure
    const articles = [
      {
        id: "art-101",
        title: "Kollektivtrafikk: Nye ruter i sentrum...",
        summary: "Bystyret har vedtatt nye rutekjøringer som skal implementeres fra neste semester. Dette vil påvirke flere tusen passasjerer daglig.",
        imageUrl: "https://vcdn.polarismedia.no/c0ac67cb-d74e-3333-a8d2-4af279c93a95?fit=clip&h=800&q=80&tight=false&w=1000",
        imageAspect: "10/7",
        layoutVariant: "hero",
        publishedAt: "2026-10-04T22:30:00Z"
      },
      {
        id: "art-102",
        title: "Vær i høgen: Sol og varmere ime stil på høsten...",
        summary: "Værvarslinga viser at det blir pent og varmt de neste dagene. Perfekt tid for høsttur!",
        imageUrl: "https://vcdn.polarismedia.no/344eb1e3-7831-46ad-b389-9bf7ef359e2b?fit=clip&q=80&tight=false&w=2000",
        imageAspect: "3/2",
        layoutVariant: "media-left",
        publishedAt: "2026-10-04T21:15:00Z"
      }
    ];

    // Render articles based on data structure
    function renderArticles() {
      const container = document.getElementById('articlesContainer');
      let adSectionInserted = false;

      articles.forEach(article => {
        if (article.layoutVariant === 'hero') {
          const heroDiv = document.createElement('div');
          heroDiv.className = 'hero-article';
          heroDiv.innerHTML = `
            ${article.imageUrl ? `<img src="${article.imageUrl}" alt="${article.title}" class="hero-image">` : ''}
            <h2>${article.title}</h2>
            <p>${article.summary}</p>
          `;
          container.appendChild(heroDiv);

          // Insert advertisement section right after hero article
          if (!adSectionInserted) {
            const adSection = document.getElementById('adSection')
            container.appendChild(adSection);
            adSectionInserted = true;
          }
        } else if (article.layoutVariant === 'media-left') {
          const mediaDiv = document.createElement('div');
          mediaDiv.className = 'article-media-left';
          mediaDiv.innerHTML = `
            <div class="article-image" style="background-image: url('${article.imageUrl}'); background-size: cover; background-position: center;"></div>
            <div class="article-content">
              <h3>${article.title}</h3>
              <p>${article.summary}</p>
            </div>
          `;
          container.appendChild(mediaDiv);
        }
      });

    }

    // Initialize articles on page load
    document.addEventListener('DOMContentLoaded', renderArticles);

    // Security: validate origin (allow parent window's origin)
    const ALLOWED_ORIGIN = window.location.origin;

    window.addEventListener('message', (event) => {
      // Origin validation
      if (event.origin !== ALLOWED_ORIGIN) {
        console.warn(`[Security] Message blocked from untrusted origin: ${event.origin}`);
        return;
      }

      if (event.data?.type === 'AD_CONFIG_UPDATE') {
        try {
          const { payload } = event.data;
          const container = document.getElementById('adContainer');

          if (payload.heading !== undefined) {
            document.getElementById('adHeading').textContent = payload.heading || 'Overskrift kommer her';
          }

          if (payload.body !== undefined) {
            document.getElementById('adBody').textContent = payload.body;
          }

          if (payload.ctaText !== undefined) {
            const ctaBtn = document.getElementById('adCta');
            ctaBtn.textContent = payload.ctaText || 'Klikk her';
            ctaBtn.style.display = payload.ctaText ? 'inline-block' : 'none';
          }

          if (payload.imageUrl !== undefined) {
            const imgDiv = document.getElementById('adImage');
            if (payload.imageUrl) {
              imgDiv.innerHTML = `<img src="${payload.imageUrl}" alt="Ad image">`;
            } else {
              imgDiv.textContent = 'Bilde kommer her';
            }
          }

          if (payload.theme !== undefined) {
            const validThemes = ['blue', 'red', 'green', 'dark'];
            const theme = validThemes.includes(payload.theme) ? payload.theme : 'blue';
            container.className = `ad-container theme-${theme}`;
          }

          document.getElementById('status').textContent = 'Oppdatert ✓';

          // Send confirmation back to parent (only to trusted origin)
          window.parent.postMessage(
            { type: 'AD_CONFIG_ACK', data: { timestamp: new Date().toISOString() } },
            ALLOWED_ORIGIN
          );
        } catch (error) {
          console.error('[Error] Failed to process message:', error);
          document.getElementById('status').textContent = 'Feil ved oppdatering';
        }
      }
    });

    window.parent.postMessage({
      type: "PREVIEW_READY",
      data: {
        timestamp: new Date().toISOString()
      }
    }, "*")
  </script>
</body>
</html>
